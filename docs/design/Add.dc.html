<html lang="en">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #8A8D94; font-family: Inter, system-ui, sans-serif; color: #111318; font-feature-settings: 'tnum' 1">
  <div aria-hidden="true" style="position: absolute; left: 10px; right: 10px; top: 54px; height: 60px; border-radius: 22px 22px 0 0; background: #B9BBC0"></div>

  <div role="dialog" aria-label="New expense" style="position: absolute; left: 0; right: 0; top: 70px; bottom: 0; background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 8px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #D6D8DD; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 32px">
      <button style="border: none; background: transparent; color: #2F5BEA; font: 500 16px Inter, sans-serif; padding: 0">Cancel</button>
      <div style="font-size: 16px; font-weight: 600">New expense</div>
      <button aria-label="Scan a receipt" style="border: none; background: transparent; color: #2F5BEA; padding: 0; width: 44px; display: flex; justify-content: flex-end">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; background: #F2F3F5; padding: 3px; border-radius: 11px">
      <button style="border: none; background: #FFFFFF; font: 600 14px Inter, sans-serif; color: #111318; padding: 8px 0; border-radius: 9px; box-shadow: 0 1px 2px rgba(17,19,24,0.1)">Expense</button>
      <button style="border: none; background: transparent; font: 500 14px Inter, sans-serif; color: #4A505B; padding: 8px 0; border-radius: 9px">Income</button>
      <button style="border: none; background: transparent; font: 500 14px Inter, sans-serif; color: #4A505B; padding: 8px 0; border-radius: 9px">Transfer</button>
      <button style="border: none; background: transparent; font: 500 14px Inter, sans-serif; color: #4A505B; padding: 8px 0; border-radius: 9px">Invest</button>
    </div>

    <div style="text-align: center; padding: 6px 0 2px">
      <span style="font-size: 30px; font-weight: 600; color: #8A909B; vertical-align: top; line-height: 64px">$</span><span style="font-size: 58px; font-weight: 700; letter-spacing: -0.03em; line-height: 64px">12.50</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button style="border: 2px solid #2F5BEA; background: #E8EEFF; border-radius: 16px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 12px Inter, sans-serif; color: #1E3FB0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"></path><path d="M6 2v2M10 2v2M14 2v2"></path></svg>Coffee</button>
      <button style="border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 16px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px Inter, sans-serif; color: #111318">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4580A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"></path></svg>Dining</button>
      <button style="border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 16px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px Inter, sans-serif; color: #111318">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#137A43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path></svg>Groceries</button>
      <button style="border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 16px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px Inter, sans-serif; color: #111318">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F5BEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="3"></rect><path d="M4 11h16M8 21l-2-4M16 21l2-4"></path><circle cx="8" cy="14" r=".5"></circle><circle cx="16" cy="14" r=".5"></circle></svg>Transit</button>
      <button style="border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 16px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px Inter, sans-serif; color: #111318">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17"></path><path d="M3 22h12M15 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V8l-3-3"></path></svg>Fuel</button>
      <button style="border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 16px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px Inter, sans-serif; color: #111318">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2347A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><path d="M3 6h18M16 10a4 4 0 0 1-8 0"></path></svg>Shopping</button>
      <button style="border: 1px solid #E3E5E9; background: #FFFFFF; border-radius: 16px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px Inter, sans-serif; color: #111318">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B3CC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path></svg>Streaming</button>
      <button style="border: 1px dashed #C9CDD4; background: #FFFFFF; border-radius: 16px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px Inter, sans-serif; color: #4A505B">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>All</button>
    </div>

    <div style="display: flex; gap: 8px">
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: #F2F3F5; color: #111318; font: 500 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>Visa Rewards</button>
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: #F2F3F5; color: #111318; font: 500 13px Inter, sans-serif">Today</button>
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: #F2F3F5; color: #4A505B; font: 500 13px Inter, sans-serif">+ Payee, note</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: auto">
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">1</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">2</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">3</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">4</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">5</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">6</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">7</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">8</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">9</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">.</button>
      <button style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; font: 500 22px Inter, sans-serif; color: #111318">0</button>
      <button aria-label="Delete digit" style="height: 46px; border: none; border-radius: 12px; background: #F6F7F8; color: #111318; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><path d="M18 9l-6 6M12 9l6 6"></path></svg></button>
    </div>

    <button style="height: 54px; border: none; border-radius: 16px; background: #2F5BEA; color: #FFFFFF; font: 600 17px Inter, sans-serif">Add $12.50 to Coffee</button>
  </div>
</div>
</x-dc>
