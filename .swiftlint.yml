included: [Finlynq, FinlynqTests, FinlynqUITests]
excluded: [build]
opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - redundant_nil_coalescing
  - unused_import
  - closure_spacing
  - toggle_bool
  - contains_over_filter_count
line_length: 140
type_body_length: 300
file_length: 500
identifier_name:
  excluded: [id, x, y]
